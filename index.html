<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gosalbez Broker de Seguros</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b3a">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gosalbez">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mut:#6b7686;--bd:#e2e6ec;--ac:#0c76f5;--wa:#1a9b5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mut:#93a0b1;--bd:#2b3441;--ac:#4a9bff;--wa:#3ec585}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mut:#93a0b1;--bd:#2b3441;--ac:#4a9bff;--wa:#3ec585}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px;text-align:center}
.logo{background:#fff;border-radius:16px;padding:14px;text-align:center;margin-bottom:14px;border:1px solid var(--bd)}
.logo a{display:inline-block}
.logo img{width:min(260px,70%);height:auto;display:block;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grid{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;font:inherit;color:var(--tx)}
.opt.on{border-color:var(--ac)}
.opt .i{font-size:1.9rem}
.opt b{display:block;font-size:1.05rem}
.opt span{color:var(--mut);font-size:.88rem}
.panel{margin-top:16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.panel h2{margin:0 0 6px;font-size:1.2rem}
.panel h3{font-size:.95rem;margin:16px 0 6px}
.panel ul{margin:0;padding-left:20px;color:var(--mut);font-size:.92rem}
.alert{background:rgba(214,69,69,.1);border:1px solid #d64545;border-radius:10px;padding:8px 12px;font-size:.88rem;margin:10px 0}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1 1 150px;text-align:center;padding:11px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;text-decoration:none;cursor:pointer}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.foot{margin-top:24px;color:var(--mut);font-size:.85rem;text-align:center}
.credCard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px}
.credCard h4{margin:0 0 10px;font-size:1.05rem}
.credHead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.credHead img{max-height:42px;max-width:110px;object-fit:contain}
.credHead .credTitle{flex:1;text-align:center;font-weight:700;font-size:.95rem;color:var(--mut)}
.credRow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:.92rem}
.credRow:last-child{border-bottom:none}
.credRow span:first-child{color:var(--mut)}
.credRow span:last-child{font-weight:600;text-align:right}
@media print{
  body *{visibility:hidden}
  #credResult,#credResult *{visibility:visible}
  #credResult{position:absolute;top:0;left:0;width:100%;padding:20px}
}
</style>
</head>

const $=id=>document.getElementById(id);
$("broker").textContent=CFG.broker;$("foot").innerHTML="Atención: "+CFG.horario+" · Tel. "+CFG.tel+'<br><a href="https://www.gosalbez.com.ar" target="_blank" rel="noopener" style="color:var(--ac)">www.gosalbez.com.ar</a>';
$("opts").innerHTML=S.map(s=>`<button class="opt" data-id="${s.id}"><div class="i">${s.i}</div><div><b>${s.t}</b><span>${s.d}</span></div></button>`).join("");
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const s=S.find(x=>x.id===b.dataset.id);
  if(s.subtypes)showSubtypePicker(s);else show(s.id);
});
function backToMenu(){
  document.querySelectorAll(".opt").forEach(b=>b.classList.remove("on"));
  $("panel").innerHTML="";
  $("opts").scrollIntoView({behavior:"smooth",block:"start"});
}
function showSubtypePicker(s){
  document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b.dataset.id===s.id));
  $("panel").innerHTML=`<div class="panel"><h2>${s.i} ${s.t}</h2><h3>¿Qué tipo de siniestro tuviste?</h3><div class="grid" style="margin-top:10px">${s.subtypes.map(st=>`<button type="button" class="opt" data-v="${st.v}"><div class="i">${st.i}</div><div><b>${st.v}</b><span>${st.d}</span></div></button>`).join("")}</div></div>`;
  $("panel").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>show(s.id,{tipo:b.dataset.v}));
  $("panel").scrollIntoView({behavior:"smooth",block:"start"});
}
function show(id,fixed){
  const s=S.find(x=>x.id===id);
  if(s.subtypes&&!fixed){showSubtypePicker(s);return}
  document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  if(s.companies){
    $("panel").innerHTML=`<div class="panel"><h2>${s.i} ${s.t}</h2>
    <div class="grid" style="margin-top:10px">${s.companies.map(c=>`<div style="background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px"><b>${c.n}</b><div class="btns" style="margin-top:8px"><a class="btn wa" href="tel:${c.tel.replace(/[^+\d]/g,"")}">📞 ${c.tel}</a><a class="btn" href="${c.web}" target="_blank" rel="noopener">Sitio web</a></div></div>`).join("")}</div></div>`;
    $("panel").scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(s.credLookup){
    $("panel").innerHTML=`<div class="panel"><h2>${s.i} ${s.t}</h2>
    <h3>Ingresá tu patente</h3>
    <div class="fw"><label>Patente</label><input id="credPat" type="text" placeholder="Ej: AB123CD" maxlength="10" style="text-transform:uppercase"></div>
    <div id="credErr" style="display:none;background:rgba(214,69,69,.1);border:1px solid #d64545;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.9rem;color:#d64545"></div>
    <div class="btns"><button type="button" class="btn wa" id="credBtn">Buscar mi credencial</button></div>
    <div id="credResult" style="display:none;margin-top:18px"></div>
    <p style="color:var(--mut);font-size:.85rem;margin-top:16px">¿No la encontrás? <a href="${s.link}" style="color:var(--ac)">Probá con el portal oficial</a>.</p></div>`;
    $("panel").scrollIntoView({behavior:"smooth",block:"start"});
    const pat=$("credPat"),err=$("credErr"),res=$("credResult"),btn=$("credBtn");
    function buscar(){
      const v=pat.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
      err.style.display="none";res.style.display="none";
      if(!v){err.textContent="Ingresá una patente.";err.style.display="";return}
      if(!s.lookupUrl){err.textContent="La búsqueda no está disponible en este momento.";err.style.display="";return}
      btn.disabled=true;btn.textContent="Buscando…";
      fetch(`${s.lookupUrl}?patente=${encodeURIComponent(v)}`)
        .then(r=>r.json())
        .then(j=>{
          if(!j.ok){err.textContent=j.error||"No encontramos una póliza vigente con esa patente.";err.style.display="";return}
          const d=j.data;
          const fmtFecha=(v)=>{
            if(!v)return"-";
            const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})T/);
            if(m)return`${m[3]}/${m[2]}/${m[1]}`;
            return v;
          };
          const ci=compInfo(d.compania);
          const brokerLogo=(document.querySelector(".logo img")||{}).src||"";
          const compLogo=ci&&ci.logo?ci.logo:"";
          const compName=ci&&ci.name?ci.name:(d.compania||"-");
          const grua=ci&&ci.tel?ci.tel:CFG.tel;
          res.innerHTML=`<div class="credCard">
          <div class="credHead">
            ${brokerLogo?`<img src="${brokerLogo}" alt="Gosalbez Broker">`:'<span></span>'}
            <span class="credTitle">🪪 Credencial de circulación</span>
            ${compLogo?`<img src="${compLogo}" alt="${compName}" onerror="this.style.display='none'">`:'<span></span>'}
          </div>
          <div class="credRow"><span>Marca / Modelo</span><span>${[d.marca,d.modelo].filter(Boolean).join(" ")||"-"}</span></div>
          <div class="credRow"><span>Año</span><span>${d.anio||"-"}</span></div>
          <div class="credRow"><span>Patente</span><span>${d.patente||"-"}</span></div>
          <div class="credRow"><span>Compañía</span><span>${compName}</span></div>
          <div class="credRow"><span>N° de póliza</span><span>${d.poliza||"-"}</span></div>
          <div class="credRow"><span>Vigencia</span><span>${fmtFecha(d.inicio)} al ${fmtFecha(d.fin)}</span></div>
          <div class="credRow"><span>Asegurado</span><span>${d.asegurado||"-"}</span></div>
          <div class="credRow"><span>Chasis</span><span>${d.chasis||"-"}</span></div>
          <div class="credRow"><span>Motor</span><span>${d.motor||"-"}</span></div>
          <div class="credRow"><span>Teléfono de grúa</span><span>${grua}</span></div>
          </div>
          <p style="color:var(--mut);font-size:.72rem;line-height:1.4;margin-top:12px;text-align:justify">La posesión de este comprobante obligatorio será prueba suficiente de la vigencia del seguro obligatorio de automotores por el artículo 68 de la Ley N° 24.449. Conforme el artículo 2 de la Disposición N° 70/2009 de la AGENCIA NACIONAL DE SEGURIDAD VIAL, la falta de portación del recibo de pago de la prima del seguro obligatorio por parte del conductor del vehículo, no podrá ser aducida por la autoridad de constatación para determinar el incumplimiento de los requisitos para la circulación.</p>
          <div class="btns"><button type="button" class="btn wa" id="credPrint">Imprimir / Guardar PDF</button></div>`;
          res.style.display="";
          $("credPrint").onclick=()=>window.print();
        })
        .catch(()=>{err.textContent="No pudimos conectarnos para buscar tu credencial. Probá de nuevo en unos minutos.";err.style.display="";})
        .finally(()=>{btn.disabled=false;btn.textContent="Buscar mi credencial";});
    }
    btn.onclick=buscar;
    pat.addEventListener("keydown",e=>{if(e.key==="Enter")buscar();});
    return;
  }
  const visibleFields=fixed?s.f.filter(f=>!(f.id in fixed)&&(!f.show||fixed[f.show[0]]===f.show[1])):s.f;
  const fld=visibleFields.map(f=>{
    const at=f.show?` data-show-if="${f.show[0]}" data-show-val="${f.show[1]}" style="display:none"`:"";
    if(f.t==="heading")return `<div class="fw"${at}><h3 style="margin:14px 0 6px">${f.l}</h3></div>`;
    if(f.t==="note")return `<div class="fw"${at}><p style="color:var(--mut);font-size:.85rem;margin:10px 0">${f.l}</p></div>`;
    const rq=f.req?" required":"";
    const inp=f.t==="select"?`<select data-k="${f.id}"${rq}>${f.o.map(o=>`<option>${o}</option>`).join("")}</select>`:f.t==="area"?`<textarea data-k="${f.id}" rows="3"${rq}></textarea>`:`<input data-k="${f.id}" type="${f.t}"${rq}>`;
    return `<div class="fw"${at}><label>${f.l}</label>${inp}${f.req?'<span class="errmsg" style="display:none;color:#d64545;font-size:.8rem">Completá este campo.</span>':""}</div>`;
  }).join("");
  $("panel").innerHTML=`<div class="panel"><h2>${s.i} ${s.t}</h2>
  ${s.alert?`<div class="alert">⚠️ ${s.alert}</div>`:""}
  ${s.list?`<h3>Tené a mano</h3><ul>${s.list.map(x=>`<li>${x}</li>`).join("")}</ul><p style="color:var(--mut);font-size:.88rem;margin:10px 0 0">${s.tip}</p>`:`<h3>Cómo hacerlo</h3><ul>${s.steps.map(x=>`<li>${x}</li>`).join("")}</ul>`}
  ${s.link?`<div class="btns"><a class="btn wa" href="${s.link}">${s.linkLabel||"Completar formulario de denuncia"}</a></div></div>`:`<h3>Tus datos</h3>${fld}
  ${s.notify?`<div id="reqwarn" style="display:none;background:rgba(214,69,69,.1);border:1px solid #d64545;border-radius:10px;padding:10px 12px;margin-top:14px;font-size:.9rem;color:#d64545">⚠️ Faltan completar campos obligatorios, marcados en rojo arriba.</div>
  <div id="rcpt" style="display:none;background:rgba(26,155,91,.1);border:1px solid var(--wa);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:.9rem"></div>
  <div class="btns"><button type="button" class="btn wa" id="bs">Enviar</button></div></div>`
  :`<div class="btns"><a class="btn wa" id="bw" target="_blank" rel="noopener">Enviar por WhatsApp</a><a class="btn" id="bm">Enviar por email</a></div></div>`}`}`;
  if(s.link){$("panel").scrollIntoView({behavior:"smooth",block:"start"});return}
  function toggleConds(){
    $("panel").querySelectorAll("[data-show-if]").forEach(w=>{
      const dep=$("panel").querySelector(`[data-k="${w.dataset.showIf}"]`);
      w.style.display=(dep&&dep.value===w.dataset.showVal)?"":"none";
    });
  }
  toggleConds();
  const upd=()=>{
    toggleConds();
    const parts=[];
    $("panel").querySelectorAll("[data-k]").forEach(el=>{
      const w=el.closest(".fw");
      if(w&&w.style.display==="none")return;
      const f=s.f.find(x=>x.id===el.dataset.k);
      parts.push(`${f.l}: ${el.value.trim()||"-"}`);
    });
    const v=parts.join("\n");
    const msg=`Hola, quiero gestionar: ${s.t}.\n${v}`;
    if(!s.notify){
      $("bw").href=`https://wa.me/${CFG.wa}?text=${encodeURIComponent(msg)}`;
      $("bm").href=`mailto:${CFG.mail}?subject=${encodeURIComponent(s.t)}&body=${encodeURIComponent(msg)}`;
    }
  };
  function checkReq(){
    let ok=true,firstBad=null;
    $("panel").querySelectorAll("[data-k][required]").forEach(el=>{
      const w=el.closest(".fw");
      if(w&&w.style.display==="none")return;
      const bad=!el.value.trim()||(el.type==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value));
      const err=w.querySelector(".errmsg");
      if(err)err.style.display=bad?"":"none";
      el.style.borderColor=bad?"#d64545":"";
      if(bad){ok=false;if(!firstBad)firstBad=el;}
    });
    const warn=$("reqwarn");
    if(warn)warn.style.display=ok?"none":"";
    if(!ok&&firstBad){
      firstBad.scrollIntoView({behavior:"smooth",block:"center"});
      firstBad.focus();
    }
    return ok;
  }
  document.querySelectorAll("[data-k]").forEach(el=>{el.oninput=upd;el.onchange=upd});upd();
  if(s.notify){
    $("bs").onclick=()=>{
      if(!checkReq())return;
      const btn=$("bs");
      try{
        btn.disabled=true;
        const parts=[];
        if(fixed)Object.keys(fixed).forEach(k=>{
          const f=s.f.find(x=>x.id===k);
          if(f)parts.push(`${f.l}: ${fixed[k]}`);
        });
        $("panel").querySelectorAll("[data-k]").forEach(el=>{
          const w=el.closest(".fw");
          if(w&&w.style.display==="none")return;
          const f=s.f.find(x=>x.id===el.dataset.k);
          parts.push(`${f.l}: ${el.value.trim()||"-"}`);
        });
        const clientMail=$("panel").querySelector('[data-k="mail"]').value.trim();
        const rcpt="GZ-"+new Date().getFullYear()+"-"+Math.floor(100000+Math.random()*900000);
        const subject=`Denuncia de siniestro Nº ${rcpt} — ${s.t}`;
        const bodyText=`Nº de trámite: ${rcpt}\n\n${parts.join("\n")}`;
        const mailto=`mailto:${CFG.mail}?cc=${encodeURIComponent(clientMail)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
        if(CFG.sheetsUrl&&s.sheetName&&s.cols){
          const row=s.cols.map(id=>{
            if(fixed&&(id in fixed))return fixed[id];
            const el=$("panel").querySelector(`[data-k="${id}"]`);
            if(!el)return"";
            const w=el.closest(".fw");
            if(w&&w.style.display==="none")return"";
            return el.value.trim();
          });
          try{
            // El envío del mail (al cliente, con copia a consultas@gosalbez.com.ar) y el registro en la
            // planilla los hace el Apps Script del lado del servidor. mode:"no-cors" significa que nunca
            // sabremos acá si salió bien o mal, por eso mostramos igual la confirmación y dejamos los
            // botones de respaldo (email/WhatsApp) por si el mail automático no llegara.
            fetch(CFG.sheetsUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({sheet:s.sheetName,receipt:rcpt,row,clientMail,subject,bodyText})}).catch(()=>{});
          }catch(e){}
        }
        // Éxito: se reemplaza todo el panel (formulario incluido) por únicamente el mensaje
        // de confirmación y un botón para volver al menú principal.
        $("panel").innerHTML=`<div class="panel"><div id="rcpt" style="background:rgba(26,155,91,.1);border:1px solid var(--wa);border-radius:10px;padding:14px 16px;font-size:.95rem">✅ Gracias por contactarte con Gosalbez Broker. En las próximas horas nos contactaremos para ayudarte en la gestión de tu reclamo.<br>Tu número de trámite es: <b>${rcpt}</b><br><span style="color:var(--mut);font-weight:normal">Te enviamos un email de confirmación a ${clientMail||"tu correo"} (con copia a nosotros). Si no te llega en unos minutos, revisá spam o usá estos botones:</span><div class="btns" style="margin-top:10px"><a class="btn" href="${mailto}">Reenviar por email</a><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${CFG.wa}?text=${encodeURIComponent('Hola, quiero enviar mi denuncia. Nº de trámite: '+rcpt)}">Enviar por WhatsApp</a></div></div><div class="btns" style="margin-top:14px"><button type="button" class="btn" id="backBtn">Volver al menú</button></div></div>`;
        $("backBtn").onclick=backToMenu;
        $("panel").scrollIntoView({behavior:"smooth",block:"start"});
      }catch(err){
        const r=$("rcpt");
        r.style.display="";
        r.innerHTML=`⚠️ Hubo un problema al preparar el envío. Por favor escribinos por WhatsApp o llamanos, y contanos lo que necesitás denunciar.<br><span style="color:var(--mut);font-size:.8rem">Detalle técnico: ${String(err&&err.message||err)}</span>`;
        btn.disabled=false;
      }
    };
  }else{
    [$("bw"),$("bm")].forEach(b=>b.addEventListener("click",e=>{if(!checkReq())e.preventDefault()}));
  }
  $("panel").scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
